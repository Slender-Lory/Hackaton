name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: backend/Backend.sln
      - run: dotnet restore Backend.sln
      - run: dotnet build Backend.sln -c Release --no-restore
      - run: dotnet test Backend.sln -c Release --no-build

  frontend:
    name: frontend (install + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker (build images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ВАЖНО: VITE_API_URL=/api — фронт ходит в API через nginx-прокси
      - run: docker build -f infra/docker/backend.Dockerfile -t backend:ci .
      - run: docker build -f infra/docker/frontend.Dockerfile -t frontend:ci --build-arg VITE_API_URL=/api .

  db-smoke:
    name: db-smoke (postgres + init sql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: apply infra/db/init/*.sql and list tables
        run: |
          set -euo pipefail
          for f in infra/db/init/*.sql; do
            echo "==> $f"
            docker run --rm -i --network host -e PGPASSWORD=password \
              postgres:16 psql -h localhost -U user -d appdb -v ON_ERROR_STOP=1 < "$f"
          done
          docker run --rm --network host -e PGPASSWORD=password \
            postgres:16 psql -h localhost -U user -d appdb -c '\dt'

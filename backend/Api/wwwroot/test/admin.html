<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wide">
  <h1>Админка</h1>
  <p class="muted">Зарегистрированные игроки и их прогресс (гости хранятся только в своих браузерах). <a href="./">Страница гостя</a></p>

  <section id="login-panel">
    <h2>Вход администратора</h2>
    <form id="login-form">
      <div class="row">
        <div class="grow"><label for="login">Логин</label><input id="login" autocomplete="username" required></div>
        <div class="grow"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button type="submit">Войти</button>
      </div>
    </form>
    <p id="login-msg" class="msg"></p>
  </section>

  <div id="dashboard" hidden>
    <section>
      <div class="row">
        <h2 class="grow" style="margin:0">Сводка</h2>
        <span class="muted" id="admin-name"></span>
        <button class="link" id="refresh" type="button">Обновить</button>
        <button class="link" id="logout" type="button">Выйти</button>
      </div>
      <div class="stats" id="stats" style="margin-top:12px"></div>
    </section>

    <section>
      <h2>Игроки</h2>
      <form id="search-form" class="row" style="margin-bottom:10px">
        <div class="grow"><label for="search">Поиск по никнейму или почте</label><input id="search" autocomplete="off"></div>
        <button type="submit">Найти</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Никнейм</th><th>Почта</th><th>Прогресс</th><th>Создан</th><th>Был в игре</th></tr></thead>
          <tbody id="players"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:10px; align-items:center">
        <span class="grow muted" id="page-info"></span>
        <button class="link" id="prev" type="button">← Назад</button>
        <button class="link" id="next" type="button">Вперёд →</button>
      </div>
    </section>

    <section id="details" hidden>
      <h2 id="details-title"></h2>
      <p class="muted" id="details-meta" style="margin:0 0 8px"></p>
      <div id="details-progress"></div>
    </section>
  </div>
</main>

<script>
  // Токен администратора живёт только в этой вкладке (sessionStorage).
  const TOKEN_KEY = "hackat.adminToken";
  const PAGE_SIZE = 20;

  const $ = (id) => document.getElementById(id);
  const fmt = (d) => d ? new Date(d).toLocaleString("ru-RU") : "—";
  const getToken = () => { try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; } };
  const setToken = (t) => { try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch { /* ignore */ } };

  let offset = 0;
  let selectedId = null;

  async function api(method, path, body) {
    const headers = {};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const token = getToken();
    if (token) headers["Authorization"] = `Bearer ${token}`;
    try {
      const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
      const text = await res.text();
      const data = text ? JSON.parse(text) : null;
      if (res.status === 401 && token) logout("Сессия администратора истекла, войдите снова");
      return { ok: res.ok, result: data?.result, error: data?.error ?? (res.ok ? null : { message: `Ошибка ${res.status}` }) };
    } catch (e) {
      return { ok: false, error: { message: `Нет связи с сервером: ${e.message}` } };
    }
  }

  function cell(tr, content) {
    const td = document.createElement("td");
    if (content instanceof Node) td.append(content); else td.textContent = content;
    tr.append(td);
    return td;
  }

  function progressText(progress) {
    if (!progress.length) return "не начинал";
    return progress.map((p) => `${p.professionTitle}: ур. ${p.level}, ${p.percent}%`).join("; ");
  }

  // ── Вход / выход ───────────────────────────────────────────────────
  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await api("POST", "/api/v1/admin/login", { login: $("login").value, password: $("password").value });
    if (!r.ok) {
      $("login-msg").textContent = r.error.message;
      $("login-msg").className = "msg err";
      return;
    }
    setToken(r.result.token);
    $("password").value = "";
    await openDashboard();
  });

  function logout(message) {
    setToken(null);
    $("dashboard").hidden = true;
    $("login-panel").hidden = false;
    $("login-msg").textContent = message ?? "";
    $("login-msg").className = "msg err";
  }

  async function openDashboard() {
    const me = await api("GET", "/api/v1/admin/me");
    if (!me.ok) { logout(); return; }
    $("admin-name").textContent = `Вы: ${me.result}`;
    $("login-panel").hidden = true;
    $("dashboard").hidden = false;
    $("login-msg").textContent = "";
    await Promise.all([loadStats(), loadPlayers()]);
  }

  // ── Сводка ─────────────────────────────────────────────────────────
  async function loadStats() {
    const r = await api("GET", "/api/v1/admin/stats");
    if (!r.ok) return;
    const s = r.result;
    const items = [
      ["Игроков с аккаунтом", s.totalPlayers],
      ["Новых за сутки", s.newLast24Hours],
      ["Активных за сутки", s.activeLast24Hours],
      ...s.professions.flatMap((p) => [
        [`${p.professionTitle}: начали`, p.started],
        [`${p.professionTitle}: прошли`, p.completed],
        [`${p.professionTitle}: средний %`, p.averagePercent],
      ]),
    ];
    $("stats").replaceChildren(...items.map(([title, value]) => {
      const div = document.createElement("div");
      div.className = "stat";
      const b = document.createElement("b");
      b.textContent = value;
      div.append(b, title);
      return div;
    }));
  }

  // ── Игроки ─────────────────────────────────────────────────────────
  async function loadPlayers() {
    const params = new URLSearchParams({ offset, count: PAGE_SIZE });
    const search = $("search").value.trim();
    if (search) params.set("search", search);

    const r = await api("GET", `/api/v1/admin/players?${params}`);
    const tbody = $("players");
    tbody.replaceChildren();
    if (!r.ok) {
      const tr = document.createElement("tr");
      cell(tr, r.error.message).colSpan = 5;
      tbody.append(tr);
      return;
    }

    const { items, total } = r.result;
    if (!items.length) {
      const tr = document.createElement("tr");
      cell(tr, "Никого не найдено").colSpan = 5;
      tbody.append(tr);
    }
    for (const p of items) {
      const tr = document.createElement("tr");
      tr.className = "clickable" + (p.id === selectedId ? " selected" : "");
      cell(tr, p.nickname);
      cell(tr, p.email);
      cell(tr, progressText(p.progress));
      cell(tr, fmt(p.createdAt));
      cell(tr, fmt(p.lastSeenAt));
      tr.onclick = () => loadDetails(p.id);
      tbody.append(tr);
    }

    const from = total === 0 ? 0 : offset + 1;
    $("page-info").textContent = `${from}–${offset + items.length} из ${total}`;
    $("prev").disabled = offset === 0;
    $("next").disabled = offset + items.length >= total;
  }

  async function loadDetails(id) {
    selectedId = id;
    const r = await api("GET", `/api/v1/admin/players/${id}`);
    if (!r.ok) return;
    const p = r.result;

    $("details-title").textContent = `Игрок: ${p.nickname}`;
    $("details-meta").textContent = `почта ${p.email} · id ${p.id} · зарегистрирован ${fmt(p.createdAt)} · был в игре ${fmt(p.lastSeenAt)}`;

    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>Профессия</th><th>Уровень</th><th>Пройдено</th><th>Сложность</th><th>Ревизия</th><th>Сохранено</th></tr></thead>";
    const tbody = document.createElement("tbody");
    for (const pr of p.progress) {
      const tr = document.createElement("tr");
      [pr.professionTitle, pr.level, `${pr.percent}%`, pr.difficulty, pr.revision || "не начата", fmt(pr.updatedAt)]
        .forEach((v) => cell(tr, v));
      tbody.append(tr);
      if (pr.state) {
        const stateRow = document.createElement("tr");
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(pr.state, null, 2);
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Состояние игры (State)";
        details.append(summary, pre);
        cell(stateRow, details).colSpan = 6;
        tbody.append(stateRow);
      }
    }
    table.append(tbody);
    $("details-progress").replaceChildren(table);
    $("details").hidden = false;

    await loadPlayers(); // перерисовать подсветку выбранной строки
    $("details").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); offset = 0; loadPlayers(); });
  $("prev").addEventListener("click", () => { offset = Math.max(0, offset - PAGE_SIZE); loadPlayers(); });
  $("next").addEventListener("click", () => { offset += PAGE_SIZE; loadPlayers(); });
  $("refresh").addEventListener("click", () => Promise.all([loadStats(), loadPlayers()]));
  $("logout").addEventListener("click", () => logout());

  if (getToken()) openDashboard();
</script>
</body>
</html>

# ═══════════════════════════════════════════════════════════════════
#  nginx для SPA: статика + fallback на index.html + прокси /api.
#  Монтируется как /etc/nginx/conf.d/default.conf
#
#  Прокси: запрос /api/health → http://backend:8080/health
#  (префикс /api снимается, т.к. backend не использует префикс /api).
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── gzip ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;

    # ── Хэшированные ассеты Vite: кэшировать навсегда ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API: проксирование на backend (имя сервиса из docker-compose) ──
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ── SPA fallback: любые маршруты клиентской навигации → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}

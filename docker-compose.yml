# ══════════════════════════════════════════════════════════════════
#  Docker Compose стек: PostgreSQL + .NET API + React (nginx).
#  Все значения параметризованы: cp .env.example .env
#  Любая переменная может быть опущена — сработает дефолт :-default
#  Для работы секреты не требуются: работают dev-дефолты.
# ══════════════════════════════════════════════════════════════════
name: ${COMPOSE_PROJECT_NAME:-hackat}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL-инициализация выполняется только при создании пустого volume
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Development}
      ASPNETCORE_URLS: http://+:8080
      # DATABASE_URL собирается из POSTGRES_*, но может быть переопределён целиком
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-appdb}}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change_me_at_least_32_chars}
      # Вход администратора (/test/admin.html). Пустой пароль: в Development — admin12345, иначе вход выключен
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        # URL API, который фронтенд отдаёт браузеру.
        # Либо полный (с nginx-проксированием не используется),
        # либо относительный /api → nginx проксирует на backend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
